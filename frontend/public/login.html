<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Crime Report System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="auth-logo">🛡️</div>
        <h2>Welcome Back</h2>
        <p>Sign in to your Crime Report account</p>
      </div>
      <div class="auth-card-body">
        <div id="alertBox"></div>
        <form id="loginForm" autocomplete="on">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <button type="submit" id="loginBtn" class="btn btn-primary">
            <span id="loginSpinner" class="spinner hidden"></span>
            Sign In
          </button>
        </form>
        <div class="auth-footer">
          Don't have an account? <a href="/register">Create one</a>
          <br><a href="/anonymous" style="font-size:.82rem;color:var(--text-muted)">or submit an anonymous report →</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="/js/main.js"></script>
  <script>initLoginPage();</script>
</body>
</html>
